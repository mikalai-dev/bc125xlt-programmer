name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name bc125_programmer --copy-metadata readchar main.py

      - name: Set Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION="1.0.0-dev"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Debian package structure
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/DEBIAN
          cp dist/bc125_programmer package/usr/bin/
          chmod +x package/usr/bin/bc125_programmer
          
          # Create control file
          cat <<EOF > package/DEBIAN/control
          Package: bc125-programmer
          Version: ${{ steps.vars.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Mikalai <mikalai-dev@github.com>
          Description: Uniden BC125XLT Scanner Programmer
           A Python TUI for managing channels on the Uniden BC125XLT scanner.
          EOF

      - name: Build .deb package
        run: |
          dpkg-deb --build package bc125_programmer_${{ steps.vars.outputs.version }}_${{ matrix.arch }}.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc125_programmer_deb_${{ steps.vars.outputs.version }}_${{ matrix.arch }}
          path: bc125_programmer_${{ steps.vars.outputs.version }}_${{ matrix.arch }}.deb

      - name: Create Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: bc125_programmer_${{ steps.vars.outputs.version }}_${{ matrix.arch }}.deb
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', steps.vars.outputs.version) || 'Development Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
